<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 290"><title id="title">TimesFM：连续分块输入与长块输出方法流程</title><desc id="desc">输入、核心操作、输出与评估的四步机制流程</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#176b5b"/></marker></defs><text x="30" y="45" font-family="system-ui,sans-serif" font-size="24" font-weight="600">TimesFM：连续分块输入与长块输出：输入 → 操作 → 输出</text><g font-family="system-ui,sans-serif"><g><rect x="30" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="152" y="150" text-anchor="middle" font-size="19" font-weight="600">连续历史 → 32 点分块</text><text x="152" y="180" text-anchor="middle" font-size="15">首块归一化 + 残差嵌入</text></g><g><rect x="322" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="444" y="150" text-anchor="middle" font-size="19" font-weight="600">因果解码器</text><text x="444" y="180" text-anchor="middle" font-size="15">20 层 · 200M 参数</text></g><g><rect x="614" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="736" y="150" text-anchor="middle" font-size="19" font-weight="600">连续输出头</text><text x="736" y="180" text-anchor="middle" font-size="15">一次预测未来 128 点</text></g><g><rect x="906" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="1028" y="150" text-anchor="middle" font-size="19" font-weight="600">长预测逐块继续</text><text x="1028" y="180" text-anchor="middle" font-size="15">预测值回到下一轮历史</text></g><path d="M275 172 H300" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M567 172 H592" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M859 172 H884" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/></g></svg>