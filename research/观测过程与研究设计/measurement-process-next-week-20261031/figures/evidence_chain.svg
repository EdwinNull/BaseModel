<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="evidence_chain-title evidence_chain-desc">
<title id="evidence_chain-title">从记录过程信息到后训练收益的证据链</title><desc id="evidence_chain-desc">已有过程信息和时间扰动证据不能直接推出有害的医院策略偏差。真实跨院风险代价与结构化增强超过随机增强仍待检验。</desc>
<defs><marker id="evidence_chain-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b5b"/></marker></defs>
<rect width="1000" height="480" fill="white"/>
<g font-family="-apple-system,BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="34" y="45" font-size="27" fill="#24312d" font-weight="600" text-anchor="start">证据链：已有发现能推进到哪一步</text><text x="34" y="78" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">实线边界＝已有实验支持；虚线边界＝下阶段待检验。箭头表示研究顺序。</text><rect x="34" y="124" width="202" height="210" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="48" y="157" font-size="18" fill="#176b5b" font-weight="600" text-anchor="start">01</text><text x="48" y="190" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">过程信息有预测力</text><text x="48" y="239" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">过程信息与结局相关</text><text x="48" y="264" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">加入数值后仍可有增量</text><text x="48" y="289" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">合作总结 · Stage 1</text><line x1="242" y1="223" x2="271" y2="223" stroke="#176b5b" stroke-width="2" marker-end="url(#evidence_chain-arr)"/><rect x="278" y="124" width="202" height="210" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="292" y="157" font-size="18" fill="#176b5b" font-weight="600" text-anchor="start">02</text><text x="292" y="190" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">保值序列的</text><text x="292" y="217" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">时间敏感性</text><text x="292" y="254" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">值序列及数量不变</text><text x="292" y="279" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">部分模型预测改变</text><text x="292" y="304" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">Stage 2A-v2</text><line x1="486" y1="223" x2="515" y2="223" stroke="#176b5b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#evidence_chain-arr)"/><rect x="522" y="124" width="202" height="210" rx="2" fill="white" stroke="#56655e" stroke-width="1.5" stroke-dasharray="7 6"/><text x="536" y="157" font-size="18" fill="#176b5b" font-weight="600" text-anchor="start">03</text><text x="536" y="190" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">真实跨院的风险代价</text><text x="536" y="239" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">同库多医院、共同支持</text><text x="536" y="264" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">拆查病例与标签差异</text><text x="536" y="289" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">建立可比较协议</text><line x1="730" y1="223" x2="759" y2="223" stroke="#176b5b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#evidence_chain-arr)"/><rect x="766" y="124" width="202" height="210" rx="2" fill="white" stroke="#56655e" stroke-width="1.5" stroke-dasharray="7 6"/><text x="780" y="157" font-size="18" fill="#176b5b" font-weight="600" text-anchor="start">04</text><text x="780" y="190" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">M2 超过强随机增强</text><text x="780" y="239" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">同模型与信息预算</text><text x="780" y="264" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">主要比较 M2 − M1b</text><text x="780" y="289" font-size="17" fill="#56655e" font-weight="400" text-anchor="start">最小后训练试点</text><line x1="34" y1="373" x2="968" y2="373" stroke="#b7c3bc" stroke-width="2"/><text x="34" y="411" font-size="20" fill="#176b5b" font-weight="600" text-anchor="start">关键边界：预测会变 ≠ 变化有害；保留值序列 ≠ 保留完整生理时间信息。</text><text x="34" y="447" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">医院身份可被识别，也不等于该信息必然损害结局预测。</text></g></svg>