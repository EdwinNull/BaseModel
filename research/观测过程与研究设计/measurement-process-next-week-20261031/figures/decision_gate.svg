<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" role="img" aria-labelledby="decision_gate-title decision_gate-desc">
<title id="decision_gate-title">周日科研决策树</title><desc id="decision_gate-desc">先验收实现和共同支持，再区分未判定、随机增强足够、稳定增益和有害。PEF不作为硬门槛。</desc>
<defs><marker id="decision_gate-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b5b"/></marker></defs>
<rect width="1000" height="852" fill="white"/>
<g font-family="-apple-system,BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="34" y="45" font-size="27" fill="#24312d" font-weight="600" text-anchor="start">周日决策：依据证据类型分流</text><text x="34" y="79" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">以 M2 对预算匹配 M1b 的原始概率评分差为主；负向损失越低越好。</text><rect x="34" y="119" width="326" height="69" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="51" y="162" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">输入、切分、预算验收通过？</text><line x1="372" y1="154" x2="447" y2="154" stroke="#176b5b" stroke-width="2" marker-end="url(#decision_gate-arr)"/><text x="391" y="137" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">否</text><text x="466" y="148" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">修实现与协议；结果暂不作科学判断。</text><line x1="196" y1="200" x2="196" y2="234" stroke="#176b5b" stroke-width="2" marker-end="url(#decision_gate-arr)"/><text x="211" y="224" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">是</text><rect x="34" y="246" width="326" height="69" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="51" y="289" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">目标策略在共同支持范围内？</text><line x1="372" y1="280" x2="447" y2="280" stroke="#176b5b" stroke-width="2" marker-end="url(#decision_gate-arr)"/><text x="391" y="263" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">不足</text><text x="466" y="274" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">缩小可实现策略范围，报告覆盖比例；</text><text x="466" y="302" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">不向源记录更密的区域外推。</text><line x1="196" y1="327" x2="196" y2="361" stroke="#176b5b" stroke-width="2" marker-end="url(#decision_gate-arr)"/><text x="211" y="351" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">足够</text><text x="34" y="400" font-size="22" fill="#176b5b" font-weight="600" text-anchor="start">在相同评价患者上比较 M2 − M1b</text><line x1="34" y1="420" x2="966" y2="420" stroke="#b7c3bc" stroke-width="2"/><text x="34" y="462" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">区间宽</text><text x="268" y="462" font-size="20" fill="#176b5b" font-weight="600" text-anchor="start">未判定</text><text x="268" y="491" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">给出精度不足的来源和后续样本 / 计算需求。</text><line x1="34" y1="513" x2="966" y2="513" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="544" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">接近且区间窄</text><text x="268" y="544" font-size="20" fill="#176b5b" font-weight="600" text-anchor="start">随机增强已足够</text><text x="268" y="573" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">收窄方法主张；不靠堆模型掩盖零增量。</text><line x1="34" y1="595" x2="966" y2="595" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="626" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">稳定改善</text><text x="268" y="626" font-size="20" fill="#176b5b" font-weight="600" text-anchor="start">进入下一阶段</text><text x="268" y="655" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">增加模型与医院验证，并落实最接近的基线。</text><line x1="34" y1="677" x2="966" y2="677" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="708" font-size="20" fill="#24312d" font-weight="600" text-anchor="start">评分变差</text><text x="268" y="708" font-size="20" fill="#176b5b" font-weight="600" text-anchor="start">检查机制与实现</text><text x="268" y="737" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">核对过删、信息损失、病例构成与策略误估。</text><line x1="34" y1="778" x2="966" y2="778" stroke="#b7c3bc" stroke-width="2"/><text x="34" y="816" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">PEF 是描述性比率；不用 PEF ≥ 0.3 或单一显著性阈值决定本周是否继续。</text></g></svg>