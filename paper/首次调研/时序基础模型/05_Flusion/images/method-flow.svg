<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 290"><title id="title">Flusion：跨监测信号与地区的流感概率预测方法流程</title><desc id="desc">输入、核心操作、输出与评估的四步机制流程</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#176b5b"/></marker></defs><text x="30" y="45" font-family="system-ui,sans-serif" font-size="24" font-weight="600">Flusion：跨监测信号与地区的流感概率预测：输入 → 操作 → 输出</text><g font-family="system-ui,sans-serif"><g><rect x="30" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="152" y="150" text-anchor="middle" font-size="19" font-weight="600">多信号历史</text><text x="152" y="180" text-anchor="middle" font-size="15">NHSN + ILI+ + FluSurv-NET</text></g><g><rect x="322" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="444" y="150" text-anchor="middle" font-size="19" font-weight="600">四次方根 + 114 特征</text><text x="444" y="180" text-anchor="middle" font-size="15">联合 GBQR 分位数</text></g><g><rect x="614" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="736" y="150" text-anchor="middle" font-size="19" font-weight="600">NHSN Bayesian ARX</text><text x="736" y="180" text-anchor="middle" font-size="15">8 阶滞后与地点共享</text></g><g><rect x="906" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="1028" y="150" text-anchor="middle" font-size="19" font-weight="600">23 分位数平均</text><text x="1028" y="180" text-anchor="middle" font-size="15">nowcast + 1–3 周区间</text></g><path d="M275 172 H300" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M567 172 H592" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M859 172 H884" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/></g></svg>