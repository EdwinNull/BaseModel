<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 748" role="img" aria-labelledby="week_gantt-title week_gantt-desc">
<title id="week_gantt-title">下周七日依赖计划</title><desc id="week_gantt-desc">周一协议、周二模拟、周三稀疏化验收、周四基线、周五M2、周六统计、周日复现决策。每一步有具体验收物。</desc>
<defs><marker id="week_gantt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b5b"/></marker></defs>
<rect width="1000" height="748" fill="white"/>
<g font-family="-apple-system,BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="34" y="45" font-size="27" fill="#24312d" font-weight="600" text-anchor="start">11 月 2—8 日：七天的依赖与交付</text><text x="34" y="79" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">这是计划顺序，不是已完成进度。上一环节未验收，下一环节保持缩小范围。</text><text x="261" y="128" font-size="18" fill="#56655e" font-weight="600" text-anchor="start">当天主任务</text><text x="637" y="128" font-size="18" fill="#56655e" font-weight="600" text-anchor="start">当日验收物</text><text x="34" y="186" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/02 · 一</text><circle cx="220" cy="181" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><line x1="220" y1="192" x2="220" y2="242" stroke="#176b5b" stroke-width="2" marker-end="url(#week_gantt-arr)"/><text x="261" y="186" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">冻结问题与信息边界</text><text x="637" y="186" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">协议、版本、切分审计</text><line x1="261" y1="215" x2="963" y2="215" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="260" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/03 · 二</text><circle cx="220" cy="255" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><line x1="220" y1="266" x2="220" y2="316" stroke="#176b5b" stroke-width="2" marker-end="url(#week_gantt-arr)"/><text x="261" y="260" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">理论模拟与策略初稿</text><text x="637" y="260" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">oracle / 可见历史分开</text><line x1="261" y1="289" x2="963" y2="289" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="334" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/04 · 三</text><circle cx="220" cy="329" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><line x1="220" y1="340" x2="220" y2="390" stroke="#176b5b" stroke-width="2" marker-end="url(#week_gantt-arr)"/><text x="261" y="334" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">策略拟合与顺序稀疏化</text><text x="637" y="334" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">支持审计与输入不变量</text><line x1="261" y1="363" x2="963" y2="363" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="408" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/05 · 四</text><circle cx="220" cy="403" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><line x1="220" y1="414" x2="220" y2="464" stroke="#176b5b" stroke-width="2" marker-end="url(#week_gantt-arr)"/><text x="261" y="408" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">建立公平 M0 / M1 对照</text><text x="637" y="408" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">共同预算与可复现基线</text><line x1="261" y1="437" x2="963" y2="437" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="482" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/06 · 五</text><circle cx="220" cy="477" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><line x1="220" y1="488" x2="220" y2="538" stroke="#176b5b" stroke-width="2" marker-end="url(#week_gantt-arr)"/><text x="261" y="482" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">M2；条件允许才神经冒烟</text><text x="637" y="482" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">M2 − M1b 配对预测</text><line x1="261" y1="511" x2="963" y2="511" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="556" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/07 · 六</text><circle cx="220" cy="551" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><line x1="220" y1="562" x2="220" y2="612" stroke="#176b5b" stroke-width="2" marker-end="url(#week_gantt-arr)"/><text x="261" y="556" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">统计分析与合作发现复核</text><text x="637" y="556" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">不确定性、校准与分层图</text><line x1="261" y1="585" x2="963" y2="585" stroke="#b7c3bc" stroke-width="1"/><text x="34" y="630" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">11/08 · 日</text><circle cx="220" cy="625" r="7" fill="#176b5b" stroke="none" stroke-width="2"/><text x="261" y="630" font-size="20" fill="#24312d" font-weight="500" text-anchor="start">复现与科研决策</text><text x="637" y="630" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">结果包、未决项、后续预算</text><line x1="34" y1="678" x2="966" y2="678" stroke="#b7c3bc" stroke-width="2"/><text x="34" y="714" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">并行分工：合作同学复核 timing 机制证据；主线检验结构化增强是否超过随机增强。</text></g></svg>