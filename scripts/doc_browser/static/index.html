<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档库</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/assistant.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <a class="brand-link" href="#/">
        <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15.5h6M9 9h2"/></svg></span>
        <span class="brand-text"><b>文档库</b><small id="repo-name"></small></span>
      </a>
      <button class="icon-btn" id="theme-btn" title="外观"></button>
    </div>
    <button class="search-trigger" id="search-trigger">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>搜索文件名或全文</span><kbd id="search-kbd">⌘K</kbd>
    </button>
    <nav class="side-nav">
      <a href="#/" class="side-link" id="home-link"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>首页</a>
    </nav>
    <div class="side-label"><span>目录</span><button class="icon-btn small" id="manage-btn" title="管理浏览目录"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
    <div id="tree" role="tree"></div>
  </aside>
  <div id="resizer" title="拖动调整宽度"></div>
  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="menu-btn" title="目录"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav id="crumbs"></nav>
      <button class="icon-btn" id="refresh-btn" title="重新扫描目录"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    </header>
    <div id="view"></div>
  </main>
  <div id="scrim"></div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>
<script src="/static/vendor/markdown-it.min.js"></script>
<script src="/static/vendor/markdown-it-task-lists.min.js"></script>
<script src="/static/vendor/markdown-it-footnote.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/hljs/highlight.min.js"></script>
<script src="/static/vendor/hljs/powershell.min.js"></script>
<script src="/static/vendor/hljs/dos.min.js"></script>
<script src="/static/vendor/hljs/latex.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/assistant.js"></script>
</body>
</html>
