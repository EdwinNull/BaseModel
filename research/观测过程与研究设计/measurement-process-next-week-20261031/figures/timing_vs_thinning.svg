<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="timing_vs_thinning-title timing_vs_thinning-desc">
<title id="timing_vs_thinning-title">时间重排与只删观测的操作区别</title><desc id="timing_vs_thinning-desc">时间重排固定数值序列但改变间隔。稀疏化保留原时间但丢失部分信息。三种增强需要匹配预算后比较。</desc>
<defs><marker id="timing_vs_thinning-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b5b"/></marker></defs>
<rect width="1000" height="780" fill="white"/>
<g font-family="-apple-system,BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="34" y="45" font-size="27" fill="#24312d" font-weight="600" text-anchor="start">两种干预回答不同问题</text><text x="34" y="77" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">虚构数值与时间轴，仅说明操作；不代表实验结果或预期提升。</text><text x="34" y="122" font-size="22" fill="#176b5b" font-weight="600" text-anchor="start">A  保留值序列，移动中间时间</text><text x="36" y="186" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">原始时间</text><line x1="250" y1="180" x2="910" y2="180" stroke="#b7c3bc" stroke-width="2"/><circle cx="250.0" cy="180" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="250.0" y="162" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">80</text><text x="250.0" y="211" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">0 h</text><circle cx="415.0" cy="180" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="415.0" y="162" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">92</text><text x="415.0" y="211" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">2 h</text><circle cx="662.5" cy="180" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="662.5" y="162" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">85</text><text x="662.5" y="211" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">5 h</text><circle cx="910.0" cy="180" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="910.0" y="162" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">90</text><text x="910.0" y="211" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">8 h</text><text x="36" y="276" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">时间重排</text><line x1="250" y1="270" x2="910" y2="270" stroke="#b7c3bc" stroke-width="2"/><circle cx="250.0" cy="270" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="250.0" y="252" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">80</text><text x="250.0" y="301" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">0 h</text><circle cx="332.5" cy="270" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="332.5" y="252" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">92</text><text x="332.5" y="301" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">1 h</text><circle cx="745.0" cy="270" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="745.0" y="252" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">85</text><text x="745.0" y="301" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">6 h</text><circle cx="910.0" cy="270" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="910.0" y="252" font-size="19" fill="#24312d" font-weight="500" text-anchor="middle">90</text><text x="910.0" y="301" font-size="17" fill="#56655e" font-weight="400" text-anchor="middle">8 h</text><line x1="415.0" y1="226" x2="332.5" y2="226" stroke="#176b5b" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#timing_vs_thinning-arr)"/><line x1="662.5" y1="226" x2="745.0" y2="226" stroke="#176b5b" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#timing_vs_thinning-arr)"/><text x="36" y="333" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">固定：值、顺序、数量、首末位置。可能改变：变化速度、持续时间、跨通道相位。</text><line x1="34" y1="359" x2="966" y2="359" stroke="#b7c3bc" stroke-width="2"/><text x="34" y="406" font-size="22" fill="#176b5b" font-weight="600" text-anchor="start">B  原有时间不动，只删观测</text><text x="36" y="467" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">源记录</text><line x1="250" y1="461" x2="910" y2="461" stroke="#b7c3bc" stroke-width="2"/><circle cx="250.0" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="332.5" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="415.0" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="497.5" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="580.0" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="662.5" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="745.0" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="827.5" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="910.0" cy="461" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="36" y="535" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">稀疏化视图</text><line x1="250" y1="529" x2="910" y2="529" stroke="#b7c3bc" stroke-width="2"/><circle cx="250.0" cy="529" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="332.5" cy="529" r="5" fill="white" stroke="#b7c3bc" stroke-width="2"/><line x1="327.5" y1="524" x2="337.5" y2="534" stroke="#56655e" stroke-width="1.5"/><circle cx="415.0" cy="529" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="497.5" cy="529" r="5" fill="white" stroke="#b7c3bc" stroke-width="2"/><line x1="492.5" y1="524" x2="502.5" y2="534" stroke="#56655e" stroke-width="1.5"/><circle cx="580.0" cy="529" r="5" fill="white" stroke="#b7c3bc" stroke-width="2"/><line x1="575.0" y1="524" x2="585.0" y2="534" stroke="#56655e" stroke-width="1.5"/><circle cx="662.5" cy="529" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><circle cx="745.0" cy="529" r="5" fill="white" stroke="#b7c3bc" stroke-width="2"/><line x1="740.0" y1="524" x2="750.0" y2="534" stroke="#56655e" stroke-width="1.5"/><circle cx="827.5" cy="529" r="5" fill="white" stroke="#b7c3bc" stroke-width="2"/><line x1="822.5" y1="524" x2="832.5" y2="534" stroke="#56655e" stroke-width="1.5"/><circle cx="910.0" cy="529" r="6" fill="#176b5b" stroke="none" stroke-width="2"/><text x="36" y="579" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">固定：所有保留值及其原时间戳。改变：可见信息量与记录过程表征。</text><text x="36" y="626" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">M1a：总删减量匹配的随机删减</text><text x="36" y="658" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">M1b：进一步匹配通道 × 时段预算的随机删减</text><text x="36" y="690" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">M2：在相同预算与共同支持内，依赖可见历史选择删减</text><text x="36" y="744" font-size="20" fill="#176b5b" font-weight="600" text-anchor="start">比较 M2 与 M1b，才能判断历史依赖结构是否带来额外收益。</text></g></svg>