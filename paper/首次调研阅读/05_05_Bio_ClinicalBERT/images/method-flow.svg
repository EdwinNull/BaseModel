<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 290"><title id="title">Clinical BERT：临床继续预训练的收益与反例方法流程</title><desc id="desc">输入、核心操作、输出与评估的四步机制流程</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#176b5b"/></marker></defs><text x="30" y="45" font-family="system-ui,sans-serif" font-size="24" font-weight="600">Clinical BERT：临床继续预训练的收益与反例：输入 → 操作 → 输出</text><g font-family="system-ui,sans-serif"><g><rect x="30" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="152" y="150" text-anchor="middle" font-size="19" font-weight="600">一般病历 / 出院小结</text><text x="152" y="180" text-anchor="middle" font-size="15">MIMIC-III 两种语料</text></g><g><rect x="322" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="444" y="150" text-anchor="middle" font-size="19" font-weight="600">BERT 或 BioBERT</text><text x="444" y="180" text-anchor="middle" font-size="15">继续预训练临床编码器</text></g><g><rect x="614" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="736" y="150" text-anchor="middle" font-size="19" font-weight="600">双向上下文表示</text><text x="736" y="180" text-anchor="middle" font-size="15">句级或词级线性头</text></g><g><rect x="906" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="1028" y="150" text-anchor="middle" font-size="19" font-weight="600">推理 / 实体 / 去标识化</text><text x="1028" y="180" text-anchor="middle" font-size="15">分任务验证，允许退化</text></g><path d="M275 172 H300" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M567 172 H592" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M859 172 H884" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/></g></svg>