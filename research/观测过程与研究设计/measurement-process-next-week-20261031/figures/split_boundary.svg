<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1028" role="img" aria-labelledby="split_boundary-title split_boundary-desc">
<title id="split_boundary-title">逐目标医院的support与query协议</title><desc id="split_boundary-desc">36家原tune医院划为策略库、开发和本轮留出。每个开发与留出医院按患者划分support与query。support输入估计q_h，以源带标签数据增强，树模型重拟合、神经模型从共同checkpoint适配出f_h，再对该院query推理。开发query标签仅选全局超参，留出query标签锁定到最终评价。159家历史eval本周不重评。</desc>
<defs><marker id="split_boundary-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b5b"/></marker></defs>
<rect width="1000" height="1028" fill="white"/>
<g font-family="-apple-system,BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="34" y="45" font-size="27" fill="#24312d" font-weight="600" text-anchor="start">数据边界：每个目标医院都有独立 support / query</text><text x="34" y="79" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">拟议新协议；医院数与患者归属周一锁定。目标院适配只使用 support 输入。</text><text x="34" y="130" font-size="21" fill="#176b5b" font-weight="600" text-anchor="start">源库 · MIMIC-IV</text><rect x="34" y="153" width="400" height="92" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="51" y="185" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">train：源带标签数据与源模型</text><text x="51" y="215" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">val：源侧选择与保持评估</text><line x1="446" y1="198" x2="510" y2="198" stroke="#176b5b" stroke-width="2" marker-end="url(#split_boundary-arr)"/><rect x="527" y="153" width="438" height="92" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="544" y="185" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">M0 / M1a / M1b / M2 共享源标签</text><text x="544" y="215" font-size="19" fill="#24312d" font-weight="400" text-anchor="start">骨干、输入、更新步数与预算保持可比</text><text x="34" y="294" font-size="21" fill="#176b5b" font-weight="600" text-anchor="start">eICU · 36 家原 tune 医院：本周按医院划为三组</text><rect x="34" y="318" width="268" height="126" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="51" y="353" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">策略库医院</text><text x="51" y="384" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">支持范围与策略候选</text><text x="51" y="415" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">不提供目标适配标签</text><rect x="348" y="318" width="268" height="126" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="365" y="353" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">开发医院</text><text x="365" y="384" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">每院独立 support / query</text><text x="365" y="415" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">query 标签选全局超参</text><rect x="662" y="318" width="303" height="126" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="679" y="353" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">本轮留出医院</text><text x="679" y="384" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">每院独立 support / query</text><text x="679" y="415" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">query 标签锁定至最终评价</text><text x="34" y="481" font-size="19" fill="#176b5b" font-weight="600" text-anchor="start">患者层：每个开发 / 留出医院 h 内，support 与 query 按患者互斥。</text><text x="34" y="515" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">处理跨院重复患者时保持医院留出边界；归侧或排除规则先登记。</text><line x1="34" y1="540" x2="966" y2="540" stroke="#b7c3bc" stroke-width="2"/><text x="34" y="581" font-size="21" fill="#176b5b" font-weight="600" text-anchor="start">逐目标院的适配与评价流程</text><rect x="34" y="609" width="188" height="82" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="50" y="642" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">目标院 support X</text><text x="50" y="669" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">仅输入，无标签</text><line x1="234" y1="650" x2="277" y2="650" stroke="#176b5b" stroke-width="2" marker-end="url(#split_boundary-arr)"/><rect x="290" y="609" width="150" height="82" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="307" y="642" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">拟合 q_h</text><text x="307" y="669" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">医院记录策略</text><line x1="452" y1="650" x2="495" y2="650" stroke="#176b5b" stroke-width="2" marker-end="url(#split_boundary-arr)"/><rect x="508" y="609" width="244" height="82" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="525" y="631" font-size="17" fill="#24312d" font-weight="400" text-anchor="start">源带标签数据增强</text><text x="525" y="656" font-size="17" fill="#24312d" font-weight="400" text-anchor="start">树：重拟合</text><text x="525" y="681" font-size="17" fill="#24312d" font-weight="400" text-anchor="start">神经：同 checkpoint 适配</text><line x1="764" y1="650" x2="807" y2="650" stroke="#176b5b" stroke-width="2" marker-end="url(#split_boundary-arr)"/><rect x="820" y="609" width="145" height="82" rx="2" fill="#e9f2ee" stroke="#176b5b" stroke-width="1.5"/><text x="837" y="642" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">得到 f_h</text><text x="837" y="669" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">该院预测器</text><text x="508" y="724" font-size="18" fill="#176b5b" font-weight="600" text-anchor="start">训练标签仅来自 MIMIC</text><path d="M 892 703 L 892 769 L 765 769" fill="none" stroke="#176b5b" stroke-width="2" marker-end="url(#split_boundary-arr)"/><rect x="34" y="731" width="332" height="78" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="51" y="763" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">该院 query X：仅供推理</text><text x="51" y="790" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">不进入 q_h 拟合或模型适配</text><line x1="378" y1="769" x2="421" y2="769" stroke="#176b5b" stroke-width="2" marker-end="url(#split_boundary-arr)"/><rect x="434" y="731" width="318" height="78" rx="2" fill="white" stroke="#176b5b" stroke-width="1.5"/><text x="451" y="763" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">配对预测与评价</text><text x="451" y="790" font-size="18" fill="#24312d" font-weight="400" text-anchor="start">开发选参 / 留出仅最终评价</text><line x1="34" y1="843" x2="966" y2="843" stroke="#b7c3bc" stroke-width="2"/><rect x="34" y="869" width="931" height="123" rx="2" fill="#f1f3f1" stroke="#56655e" stroke-width="1.5"/><text x="51" y="903" font-size="21" fill="#24312d" font-weight="600" text-anchor="start">159 家历史 eval 医院：本周不重复评价</text><text x="51" y="935" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">历史结果已被查阅；AL4 使用过其无标签输入。不能重新命名为全新盲测集。</text><text x="51" y="965" font-size="18" fill="#56655e" font-weight="400" text-anchor="start">后续确认性证据：另行登记未触达数据 / 新外部库，并审查既往使用历史。</text></g></svg>