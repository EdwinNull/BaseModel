<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 290"><title id="title">InstructGPT：监督微调、奖励模型与 PPO 对齐方法流程</title><desc id="desc">输入、核心操作、输出与评估的四步机制流程</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#176b5b"/></marker></defs><text x="30" y="45" font-family="system-ui,sans-serif" font-size="24" font-weight="600">InstructGPT：监督微调、奖励模型与 PPO 对齐：输入 → 操作 → 输出</text><g font-family="system-ui,sans-serif"><g><rect x="30" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="152" y="150" text-anchor="middle" font-size="19" font-weight="600">输入</text><text x="152" y="180" text-anchor="middle" font-size="15">数据或提示</text></g><g><rect x="322" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="444" y="150" text-anchor="middle" font-size="19" font-weight="600">核心机制</text><text x="444" y="180" text-anchor="middle" font-size="15">训练或推理</text></g><g><rect x="614" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="736" y="150" text-anchor="middle" font-size="19" font-weight="600">输出</text><text x="736" y="180" text-anchor="middle" font-size="15">预测、策略或证据</text></g><g><rect x="906" y="110" width="245" height="125" rx="14" fill="#e8f2ef" stroke="#176b5b" stroke-width="2"/><text x="1028" y="150" text-anchor="middle" font-size="19" font-weight="600">评估</text><text x="1028" y="180" text-anchor="middle" font-size="15">指标与边界</text></g><path d="M275 172 H300" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M567 172 H592" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/><path d="M859 172 H884" stroke="#176b5b" stroke-width="3" marker-end="url(#a)"/></g></svg>